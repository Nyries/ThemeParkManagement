name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test-rust:
    name: Test Engine (Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with: 
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "engine"

      - name: Run Clippy (quality gate)
        run: cargo clippy --all-targets --manifest-path apps/engine/Cargo.toml -- -D warnings
      
      - name: Run Rust tests
        run: cargo test --manifest-path apps/engine/Cargo.toml

  test-gateway:
    name: Test Gateway 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate shared proto types
        run: pnpm --filter @app/shared-types run proto:gen
        
      - name: Run ESLint (quality gate)
        run: pnpm --filter gateway lint -- --max-warnings 0


      - name: Run Gateway tests
        run: pnpm --filter gateway test


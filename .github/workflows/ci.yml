name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test-rust:
    name: Test Engine (Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with: 
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "engine"

      - name: Run Clippy (quality gate)
        run: cargo clippy --all-targets --manifest-path apps/engine/Cargo.toml -- -D warnings
        
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage (quality gate)
        run: cargo llvm-cov --manifest-path apps/engine/Cargo.toml --ignore-filename-regex 'main\.rs$' --fail-under-lines 90 --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: engine-coverage
          path: apps/engine/lcov.info

  test-gateway:
    name: Test Gateway 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate shared proto types
        run: pnpm --filter @app/shared-types run proto:gen

      - name: Generate Prisma client
        run: pnpm --filter gateway exec prisma generate
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/db"

      - name: Run ESLint (quality gate)
        run: pnpm --filter gateway lint --max-warnings 0

      - name: Run Gateway tests with coverage (quality gate)
        run: pnpm --filter gateway coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: gateway-coverage
          path: apps/gateway/coverage/

  test-client:
    name: Test Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate shared proto types
        run: pnpm --filter @app/shared-types run proto:gen

      - name: Run ESLint (quality gate)
        run: pnpm --filter client lint --max-warnings 0

      - name: Run Client tests with coverage (quality gate)
        run: pnpm --filter client coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: apps/client/coverage/

syntax = "proto3";

package simulation;

service SimulationService {
    rpc SendCommand (CommandRequest) returns (CommandResponse);
    rpc StreamState (StateRequest) returns (stream WorldStateResponse);
    rpc GetMap (StateRequest) returns (MapResponse);
}

message Coord {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

message ApplyTerrain {
  string material_id = 2;
  repeated Coord coordinates = 3;
}

enum InfrastructureKind {
  INFRASTRUCTURE_KIND_UNSPECIFIED = 0;
  INFRASTRUCTURE_KIND_PATH = 1;
  INFRASTRUCTURE_KIND_RAMP = 2;
  INFRASTRUCTURE_KIND_STAIRS = 3;
}

message PlaceInfrastructure {
  InfrastructureKind kind = 1;
  int32 to_z = 2; // Ignored when kind == INFRASTRUCTURE_PATH
  repeated Coord coordinates = 3;
}

message RemoveInfrastructure {
  repeated Coord coordinates = 1;
}

enum Rotation {
  ROTATION_DEG_0 = 0;
  ROTATION_DEG_90 = 1;
  ROTATION_DEG_180 = 2;
  ROTATION_DEG_270 = 3;
}

message PlaceBuilding {
  string template_id = 1;
  Coord origin = 2;
  Rotation rotation = 3;
}

message RemoveBuilding {
  Coord position = 1;
}

message CommandRequest {
  string park_id = 1;
  oneof command {
    ApplyTerrain apply_terrain = 2;
    PlaceInfrastructure place_infrastructure = 3;
    RemoveInfrastructure remove_infrastructure = 4;
    PlaceBuilding place_building = 5;
    RemoveBuilding remove_building = 6;
  }  
}

enum ErrorCode {
  ERROR_NONE = 0;
  ERROR_EMPTY = 1;
  ERROR_OUT_OF_BOUNDS = 2;
  ERROR_COLLISION = 3;
  ERROR_CROSSING_NOT_ALLOWED = 4;
  ERROR_INVALID_TEMPLATE = 5;
  ERROR_INSUFFICIENT_FUNDS = 6;
}

message CommandResponse {
  bool success = 1;
  string message = 2;
  ErrorCode error_code = 3;
}

message StateRequest {
  string park_id = 1;
}

message VisitorState {
  string id = 1;
  float x = 2;
  float y = 3;
  float z = 4;
}

message WorldStateResponse {
  uint64 tick_count = 1;
  string dirty_chunks_json = 2;
  repeated VisitorState visitors = 3;
}

message TerrainCell {
  Coord coord = 1;
  string material_id = 2;
}

message InfrastructureCell {
  Coord coord = 1;
  InfrastructureKind kind = 2;
  int32 to_z = 3;
}

message MapResponse {
  int32 min_x = 1;
  int32 max_x = 2;
  int32 min_y = 3;
  int32 max_y = 4;
  repeated TerrainCell terrain = 5;
  repeated InfrastructureCell infrastructure = 6;
  Coord entrance = 7;
  
}
syntax = "proto3";

package simulation;

service SimulationService {
    rpc SendCommand (CommandRequest) returns (CommandResponse);
    rpc StreamState (StateRequest) returns (stream WorldStateResponse);
}

message Coord {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

enum Layer { 
  LAYER_UNSPECIFIED = 0;
  LAYER_TERRAIN = 1;
  LAYER_INFRASTRUCTURE = 2;
  LAYER_BUILDINGS = 3;
}

message ApplyBrush {
  Layer layer = 1;
  string material_id = 2;
  repeated Coord coordinates = 3;
}

enum Rotation {
  ROTATION_DEG_0 = 0;
  ROTATION_DEG_90 = 1;
  ROTATION_DEG_180 = 2;
  ROTATION_DEG_270 = 3;
}

message PlaceEntity {
  string template_id = 1;
  Coord origin = 2;
  Rotation rotation = 3;
}

message RemoveEntity {
  Coord position = 1;
}

message CommandRequest {
  string park_id = 1;
  oneof command {
    ApplyBrush apply_brush = 2;
    PlaceEntity place_entity = 3;
    RemoveEntity remove_entity = 4;
  }  
}

enum ErrorCode {
  ERROR_NONE = 0;
  ERROR_EMPTY = 1;
  ERROR_OUT_OF_BOUNDS = 2;
  ERROR_COLLISION = 3;
  ERROR_CROSSING_NOT_ALLOWED = 4;
  ERROR_INVALID_TEMPLATE = 5;
  ERROR_INSUFFICIENT_FUNDS = 6;
}

message CommandResponse {
  bool success = 1;
  string message = 2;
  ErrorCode error_code = 3;
}

message StateRequest {
  string park_id = 1;
}

message WorldStateResponse {
  uint64 tick_count = 1;
  string dirty_chunks_json = 2;
}